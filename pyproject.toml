[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-gpu-admission-guard"
version = "0.1.0"
description = "Deterministic admission evidence for Kubernetes GPU workloads"
requires-python = ">=3.11"

[project.scripts]
gpu-admission-guard = "kubernetes_gpu_admission_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
