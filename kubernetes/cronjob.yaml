apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-admission-guard-audit
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: guard
              image: ghcr.io/replace-me/kubernetes-gpu-admission-guard:0.1.0
              args: ["--input", "/evidence/cluster-snapshot.json"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
